spring.application.name=pet-store-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petstore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:petstore}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

petstore.auth.jwt.secret=${JWT_SECRET}
petstore.auth.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
petstore.auth.demo-users-enabled=${DEMO_USERS_ENABLED:false}
petstore.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
